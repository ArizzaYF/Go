<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Piedra · Papel · Tijera</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #4502FF;
            --surface: #111114;
            --card:    #18181c;
            --border:  #2a2a30;
            --text:    #e8e8ed;
            --muted:   #52525e;
            --yellow:  #FFDA14;
        }
        body {
            font-family: 'VT323', monospace;
            background: var(--surface);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            padding: 32px;
        }
        .tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 3px 12px;
        }
        h1 {
            font-family: 'VT323', monospace;
            font-size: 35px;
            color: var(--text);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            line-height: 1;
            margin-top: 8px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 4px 4px 0 var(--primary);
            padding: 32px 40px;
        }
        .botones {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .sep {
            width: 1px;
            height: 64px;
            background: var(--border);
        }
        .botones form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .btn-opcion {
            width: 88px;
            height: 88px;
            background: var(--surface);
            border: 1px solid var(--border);
            cursor: pointer;
            display: grid;
            place-items: center;
            box-shadow: 3px 3px 0 var(--primary);
            transition: box-shadow 80ms ease, transform 80ms ease, border-color 120ms ease;
        }
        .btn-opcion svg {
            width: 36px;
            height: 36px;
            stroke: var(--text);
            stroke-width: 1.5;
            fill: none;
            transition: stroke 120ms ease;
        }
        .btn-opcion:hover { border-color: var(--primary); }
        .btn-opcion:hover svg { stroke: var(--primary); }
        .btn-opcion:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
        .btn-opcion:active {
            box-shadow: 0px 0px 0 var(--primary);
            transform: translate(3px, 3px);
        }
        .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
            <span class="tag">Player vs CPU</span>
            <h1>Piedra · Papel · Tijera</h1>
        </div>

        <div class="card">
            <div class="botones">

                <form action="/jugar" method="POST">
                    <input type="hidden" name="jugador" value="piedra">
                    <button class="btn-opcion" type="submit" aria-label="Elegir piedra">
                        <!-- mountain / roca -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 20L8.5 9l4 6 2.5-4 6 9H3z" stroke-linejoin="round" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <span class="label">Piedra</span>
                </form>

                <div class="sep"></div>

                <form action="/jugar" method="POST">
                    <input type="hidden" name="jugador" value="papel">
                    <button class="btn-opcion" type="submit" aria-label="Elegir papel">
                        <!-- file / documento -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-linecap="round" stroke-linejoin="round"/>
                            <polyline points="14 2 14 8 20 8" stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="16" y1="13" x2="8" y2="13" stroke-linecap="round"/>
                            <line x1="16" y1="17" x2="8" y2="17" stroke-linecap="round"/>
                            <polyline points="10 9 9 9 8 9" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <span class="label">Papel</span>
                </form>

                <div class="sep"></div>

                <form action="/jugar" method="POST">
                    <input type="hidden" name="jugador" value="tijera">
                    <button class="btn-opcion" type="submit" aria-label="Elegir tijera">
                        <!-- scissors -->
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="6" cy="6" r="3" stroke-linecap="round"/>
                            <circle cx="6" cy="18" r="3" stroke-linecap="round"/>
                            <line x1="20" y1="4" x2="8.12" y2="15.88" stroke-linecap="round"/>
                            <line x1="14.47" y1="14.48" x2="20" y2="20" stroke-linecap="round"/>
                            <line x1="8.12" y1="8.12" x2="12" y2="12" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <span class="label">Tijera</span>
                </form>

            </div>
        </div>
    </div>
</body>
</html>
